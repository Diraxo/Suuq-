<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUUQIYE — offline</title>
<style>
  html,body{margin:0;height:100%;background:#030712;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  h1{font-size:22px;margin:0}
  p{margin:0;color:#94a3b8;max-width:320px;line-height:1.5}
  button{margin-top:8px;min-height:44px;padding:0 28px;border:0;border-radius:999px;background:#818cf8;color:#0b1020;font-size:16px;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" width="64" height="64" alt="" style="border-radius:16px">
  <h1>You're offline</h1>
  <p>SUUQIYE can't reach the internet right now. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online',function(){location.reload()})</script>
</body>
</html>
