<!doctype html>
<html lang="en">
<head>

<title>Fursad — Legal</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #F6F6F2;
    color: #1A1A1A;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
  .mark {
    width: 56px; height: 56px; border-radius: 16px;
    background: #1A7F5A; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; margin-bottom: 16px;
  }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p.sub { color: #5B5B5B; margin: 0 0 32px; }
  .card {
    display: block;
    background: #fff;
    border: 1px solid #E5E5E0;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
    text-decoration: none;
    color: #1A1A1A;
  }
  .card strong { display: block; font-size: 16px; margin-bottom: 2px; }
  .card span { color: #5B5B5B; font-size: 14px; }
  footer { margin-top: 40px; color: #8A8A85; font-size: 13px; }
  a { color: #1A7F5A; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">F</div>
    <h1>Fursad</h1>
    <p class="sub">Legal information for the Fursad marketplace app.</p>

    <a class="card" href="./privacy-policy.html">

    </a>

    <footer>&copy; 2026 Fursad. All rights reserved.</footer>
